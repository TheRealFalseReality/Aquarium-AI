name: fish_ai
description: "AI tools for Aquarium!"
publish_to: 'none'
version: 3.0.01+3.0.01

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.4
  in_app_purchase: ^3.2.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.6.1
  flutter_markdown_plus: ^1.0.5
  image_picker: ^1.2.1
  google_generative_ai: ^0.4.0
  dynamic_color: ^1.8.0
  scrollable_positioned_list: ^0.3.5
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^7.0.0
  firebase_analytics: ^12.1.2
  firebase_core: ^4.4.0 
  firebase_crashlytics: ^5.0.7
  firebase_remote_config: ^6.1.4
  dart_openai: ^6.1.0
  groq: ^1.1.1 
  http: ^1.6.0
  uuid: ^4.5.2
  file_picker: ^10.3.7
  path_provider: ^2.1.3
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  web: ^1.1.1
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  default-flavor: production
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/docs/
    - assets/docs/START_HERE_I18N.md
    - assets/docs/TRANSLATION_GUIDE.md
    - assets/docs/TRANSLATION_QUICK_REF.md
    - assets/docs/CONTRIBUTING.md
    - assets/docs/LOCALIZATION_DEV_GUIDE.md
    - assets/docs/TESTING_I18N.md
    - assets/docs/I18N_IMPLEMENTATION.md
    - assets/docs/HELP_WANTED.md
    - assets/docs/CHANGELOG.md

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla-Regular.ttf
          weight: 400
        - asset: assets/fonts/Karla-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
  image_path: "assets/AquaAi Logo.png"

flutter_native_splash:
  image: assets/AquaAi Logo.png
  color: "#d8f3ff"
  color_dark: "#2D3748"
