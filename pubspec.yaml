name: fish_ai
description: "AI tools for Aquarium!"
publish_to: 'none'
version: 3.5.01+3501

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0
  shared_preferences: ^2.5.5
  in_app_purchase: ^3.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.2
  flutter_markdown_plus: ^1.0.5
  image_picker: ^1.2.2
  google_generative_ai: ^0.4.0
  dynamic_color: ^1.8.0
  scrollable_positioned_list: ^0.3.5
  cupertino_icons: ^1.0.9
  google_mobile_ads: ^8.0.0
  firebase_analytics: ^12.3.0
  firebase_app_check: ^0.4.3
  firebase_core: ^4.6.0 
  firebase_crashlytics: ^5.2.3
  firebase_remote_config: ^6.5.3
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.3.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  dart_openai: ^6.1.0
  groq: ^1.1.1 
  http: ^1.6.0
  uuid: ^4.5.3
  file_picker: ^12.0.0-beta.4
  path_provider: ^2.1.3
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  cached_network_image: ^3.4.1
  share_plus: ^13.1.0
  web: ^1.1.1
  device_info_plus: ^13.1.0
  in_app_review: ^2.0.10
  flex_color_scheme: ^8.0.0
  flutter_colorpicker: ^1.1.0
  in_app_update: ^4.2.5
  firebase_performance: ^0.11.3
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  default-flavor: production
  uses-material-design: true
  generate: true

  assets:
    - assets/images/system/
    - assets/images/fish/
    - assets/docs/en/
    - assets/docs/de/
    - assets/docs/es/
    - assets/docs/fr/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla-Regular.ttf
          weight: 400
        - asset: assets/fonts/Karla-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
  image_path: "assets/AquaAi Logo.png"

flutter_native_splash:
  image: assets/AquaAi Logo.png
  color: "#d8f3ff"
  color_dark: "#2D3748"
