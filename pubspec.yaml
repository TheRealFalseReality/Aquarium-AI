name: fish_ai
description: "AI tools for Aquarium!"
publish_to: 'none'
version: 1.1.3+1.1.3

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.6.1
  flutter_markdown_plus: ^1.0.5
  image_picker: ^1.2.0
  google_generative_ai: ^0.4.0
  dynamic_color: ^1.8.0
  scrollable_positioned_list: ^0.3.5
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^6.0.0
  firebase_analytics: ^12.0.3
  firebase_core: ^4.2.0 
  firebase_crashlytics: ^5.0.3
  dart_openai: ^6.1.0
  groq: ^1.1.1 
  uuid: ^4.4.0
  file_picker: ^10.3.3
  path_provider: ^2.1.3
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  default-flavor: production
  uses-material-design: true
  generate: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
  image_path: "assets/AquaPi Logo.png"

flutter_native_splash:
  image: assets/AquaPi Logo.png
  color: "#d8f3ff"
  color_dark: "#2D3748"


  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700
