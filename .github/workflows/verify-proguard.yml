name: Verify ProGuard Configuration

# This workflow verifies that ProGuard/R8 configuration is correct
# to prevent regression of the "Missing type parameter" notification crash

on:
  pull_request:
    paths:
      # Run when ProGuard or build config files are modified
      - 'android/app/proguard-rules.pro'
      - 'android/app/build.gradle.kts'
      - 'android/app/build.gradle'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'pubspec.yaml'
      # Also run when the verification script itself is modified
      - 'scripts/verify_proguard_config.sh'
      - '.github/workflows/verify-proguard.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'android/app/proguard-rules.pro'
      - 'android/app/build.gradle.kts'
      - 'android/app/build.gradle'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'pubspec.yaml'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  verify-proguard:
    name: Verify ProGuard Configuration
    runs-on: ubuntu-latest
    
    # Explicitly limit permissions for security
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Make verification script executable
        run: chmod +x scripts/verify_proguard_config.sh
      
      - name: Run ProGuard verification
        id: verify
        run: ./scripts/verify_proguard_config.sh
      
      - name: Check verification result
        if: failure()
        run: |
          echo "::error::ProGuard configuration verification failed!"
          echo "::error::This may cause 'Missing type parameter' crashes in release builds."
          echo "::error::Please review the errors above and fix the configuration."
          exit 1
      
      - name: Success message
        if: success()
        run: |
          echo "::notice::ProGuard configuration is correct!"
          echo "::notice::The 'Missing type parameter' crash should not occur."
  
