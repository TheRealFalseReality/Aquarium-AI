    }

    .contain {

      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;

    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;

      left: 0;
    }

    .bottomRight {
